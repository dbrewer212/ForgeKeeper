[package]
name = "app"
version = "0.2.0"
description = "Forgekeeper host for the Fenrir Forgeworks Foundry ecosystem"
authors = ["Fenrir Forgeworks"]
license = ""
repository = "https://github.com/dbrewer212/ForgeKeeper"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.0", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
base64 = "0.22"
sha2 = "0.10"
zip = "0.6"
log = "0.4"
rand = "0.8"
reqwest = { version = "0.13", features = ["json", "multipart"] }
tauri = { version = "2.11.0", features = [] }
tauri-plugin-log = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
