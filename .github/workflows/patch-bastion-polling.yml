name: Patch Bastion Polling

on:
  push:
    branches:
      - audit/foundry-bastion-20260824
    paths:
      - .github/workflows/patch-bastion-polling.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
        with:
          ref: audit/foundry-bastion-20260824
          fetch-depth: 0

      - name: Patch hidden process launch and polling
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          rust = Path("src-tauri/src/lib.rs")
          text = rust.read_text(encoding="utf-8")

          if 'use std::os::windows::process::CommandExt;' not in text:
              text = text.replace(
                  'use std::process::Command;\n',
                  'use std::process::Command;\n#[cfg(target_os = "windows")]\nuse std::os::windows::process::CommandExt;\n',
                  1,
              )

          if 'const CREATE_NO_WINDOW: u32 = 0x08000000;' not in text:
              text = text.replace(
                  'const EVENT_JOURNAL_FILE: &str = "events.jsonl";\n',
                  'const EVENT_JOURNAL_FILE: &str = "events.jsonl";\n#[cfg(target_os = "windows")]\nconst CREATE_NO_WINDOW: u32 = 0x08000000;\n',
                  1,
              )

          old = '''    let output = Command::new("powershell")
        .args(["-NoProfile", "-NonInteractive", "-Command", script])
        .output()
        .map_err(|error| format!("Failed to launch Windows telemetry provider: {error}"))?;'''
          new = '''    let mut command = Command::new("powershell");
    command.args(["-NoProfile", "-NonInteractive", "-Command", script]);
    command.creation_flags(CREATE_NO_WINDOW);
    let output = command
        .output()
        .map_err(|error| format!("Failed to launch Windows telemetry provider: {error}"))?;'''
          if old in text:
              text = text.replace(old, new, 1)

          old_shell = '''    let mut command = Command::new("cmd");
    command.arg("/C").arg("start").arg("").arg(target);'''
          new_shell = '''    let mut command = Command::new("cmd");
    command.creation_flags(CREATE_NO_WINDOW);
    command.arg("/C").arg("start").arg("").arg(target);'''
          if old_shell in text:
              text = text.replace(old_shell, new_shell, 1)

          rust.write_text(text, encoding="utf-8")

          view = Path("src/features/bastion/BastionView.tsx")
          ui = view.read_text(encoding="utf-8")
          old_effect = '''  useEffect(() => {
    void refresh();
    const id = window.setInterval(() => void refresh(), 5000);
    return () => window.clearInterval(id);
  }, []);'''
          new_effect = '''  useEffect(() => {
    let disposed = false;
    let running = false;

    const poll = async () => {
      if (disposed || running) return;
      running = true;
      try {
        await refresh();
      } finally {
        running = false;
      }
    };

    void poll();
    const id = window.setInterval(() => void poll(), 15000);
    return () => {
      disposed = true;
      window.clearInterval(id);
    };
  }, []);'''
          if old_effect not in ui:
              raise SystemExit("Could not find Bastion polling effect")
          ui = ui.replace(old_effect, new_effect, 1)
          view.write_text(ui, encoding="utf-8")
          PY

      - name: Commit repairs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/src/lib.rs src/features/bastion/BastionView.tsx
          if git diff --cached --quiet; then
            echo "No repair required."
            exit 0
          fi
          git commit -m "Hide telemetry consoles and prevent Bastion poll overlap"
          git push origin HEAD:audit/foundry-bastion-20260824
