name: Foundry Safe Dependency Remediation

on:
  push:
    branches:
      - foundry-mesh-core
    paths:
      - .github/workflows/foundry-safe-audit-fix.yml

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Foundry branch
        uses: actions/checkout@v4
        with:
          ref: foundry-mesh-core
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Apply non-breaking audit fixes only
        run: npm audit fix || true

      - name: Verify repaired lockfile
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Report remaining advisories
        run: npm audit --json || true

      - name: Commit safe remediation and remove temporary workflows
        run: |
          git config user.name "Foundry Dependency Worker"
          git config user.email "actions@users.noreply.github.com"
          git add package.json package-lock.json
          git rm -f .github/workflows/foundry-dependency-audit.yml .github/workflows/foundry-safe-audit-fix.yml
          git commit -m "Apply safe dependency remediation"
          git push origin HEAD:foundry-mesh-core
