name: One-Time Domain Schema Repair

on:
  push:
    branches:
      - foundry-mesh-core
    paths:
      - .github/workflows/repair-domain-schema.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Foundry branch with history
        uses: actions/checkout@v4
        with:
          ref: foundry-mesh-core
          fetch-depth: 0

      - name: Restore known-good domain schema and add canonical routes only
        env:
          SOURCE_COMMIT: 1f2a656f6d4a872dcd82575d3f4aa6b55327b4fa
        run: |
          git show "$SOURCE_COMMIT:src/types/domain.ts" > src/types/domain.ts
          python - <<'PY'
          from pathlib import Path
          path = Path('src/types/domain.ts')
          text = path.read_text(encoding='utf-8')
          old = 'export type ViewKey = "dashboard" | "canon" | "catalog" | "collections" | "releases" | "orders" | "filament" | "printers" | "planning" | "reports" | "recovery" | "settings";'
          new = '''export type ViewKey =
            | "dashboard"
            | "designs"
            | "planning"
            | "production"
            | "filament"
            | "printers"
            | "reports"
            | "settings"
            | "commissioning"
            | "canon"
            | "catalog"
            | "collections"
            | "releases"
            | "orders"
            | "recovery";'''
          if text.count(old) != 1:
              raise SystemExit(f'Expected one ViewKey target in known-good schema, found {text.count(old)}.')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit repair and remove this workflow
        run: |
          git config user.name "Foundry Patch Worker"
          git config user.email "actions@users.noreply.github.com"
          git add src/types/domain.ts
          git rm .github/workflows/repair-domain-schema.yml
          git commit -m "Restore domain schema and canonical Foundry routes"
          git push origin HEAD:foundry-mesh-core
