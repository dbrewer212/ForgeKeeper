name: Validate Foundry

on:
  push:
    branches:
      - main
      - foundry-mesh-core
  pull_request:

jobs:
  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Capture npm security audit
        shell: bash
        run: npm audit --json > npm-audit.json || true

      - name: Upload npm audit report
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-${{ github.sha }}
          path: npm-audit.json
          if-no-files-found: error
          retention-days: 7

      - name: Run tests
        run: npm test

      - name: Audit operational surfaces
        run: npm run audit:operational

      - name: Audit Foundry Link integration
        run: npm run audit:integration

      - name: Build frontend
        run: npm run build

  tauri-core:
    name: Rust core check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Check Tauri core
        working-directory: src-tauri
        run: cargo check
