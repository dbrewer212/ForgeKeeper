name: One-Time Printer Truth Cleanup

on:
  push:
    branches:
      - foundry-mesh-core
    paths:
      - .github/workflows/patch-printer-derivation.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Foundry branch
        uses: actions/checkout@v4
        with:
          ref: foundry-mesh-core
          fetch-depth: 0

      - name: Remove legacy Order-derived printer mutation
        env:
          LEGACY_EFFECT_B64: ICB1c2VFZmZlY3QoKCkgPT4gewogICAgc2V0UHJpbnRlcnMoKHByZXYpID0+IHByZXYubWFwKChwcmludGVyKSA9PiBwcmludGVyU3RhdHVzRnJvbU9yZGVycyhwcmludGVyLCBvcmRlcnMsIHByb2R1Y3RzKSkpOwogIH0sIFtvcmRlcnMsIHByb2R1Y3RzXSk7Cgo=
        run: |
          python - <<'PY'
          import base64
          import os
          from pathlib import Path
          path = Path('src/state/useForgekeeperState.ts')
          text = path.read_text(encoding='utf-8')
          old = base64.b64decode(os.environ['LEGACY_EFFECT_B64']).decode('utf-8')
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one legacy printer derivation effect, found {text.count(old)}.')
          path.write_text(text.replace(old, '', 1), encoding='utf-8')
          PY

      - name: Commit patch and remove this workflow
        run: |
          git config user.name "Foundry Patch Worker"
          git config user.email "actions@users.noreply.github.com"
          git add src/state/useForgekeeperState.ts
          git rm .github/workflows/patch-printer-derivation.yml
          git commit -m "Stop deriving printer state from legacy Orders"
          git push origin HEAD:foundry-mesh-core
