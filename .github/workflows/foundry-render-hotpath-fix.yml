name: Foundry Render Hotpath Fix

on:
  push:
    branches: [foundry-mesh-core]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: foundry-mesh-core
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Make recovery initialization lazy
        shell: bash
        run: |
          python -c "from pathlib import Path; p=Path('src/state/useForgekeeperState.ts'); s=p.read_text(); old='const [recoveryCheckpoints, setRecoveryCheckpoints] = useState<RecoveryCheckpoint[]>(loadRecoveryCheckpoints());'; new='const [recoveryCheckpoints, setRecoveryCheckpoints] = useState<RecoveryCheckpoint[]>(loadRecoveryCheckpoints);'; assert old in s; p.write_text(s.replace(old,new,1))"
      - name: Install
        run: npm ci
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Commit repair
        shell: bash
        run: |
          git config user.name "Foundry Performance Worker"
          git config user.email "actions@users.noreply.github.com"
          git add src/state/useForgekeeperState.ts
          git rm -f .github/workflows/foundry-render-hotpath-fix.yml
          git commit -m "Make recovery checkpoint loading lazy"
          git push origin HEAD:foundry-mesh-core
