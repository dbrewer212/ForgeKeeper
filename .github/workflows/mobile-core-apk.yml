name: Foundry Mobile Release APK
on:
  push:
    branches: [codex/mobile-core-spool-scanner]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mobile-core-apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android build requirements
        run: |
          sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018'
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run audit:operational
      - run: npm run audit:integration
      - run: npm run build
      - name: Initialize Android project
        run: npm run android:init -- --ci
      - name: Preserve app-private pairing data
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src-tauri/gen/android/app/src/main/AndroidManifest.xml')
          s=p.read_text().replace('android:allowBackup="true"','android:allowBackup="false"')
          if 'android:allowBackup=' not in s: s=s.replace('<application','<application android:allowBackup="false"',1)
          p.write_text(s)
          PY
      - name: Build Pixel 8a APK
        run: npm run android:build -- --target aarch64
      - name: APK provenance
        run: |
          mkdir -p apk-delivery
          find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' -exec cp {} apk-delivery/ \;
          sha256sum apk-delivery/*.apk > apk-delivery/SHA256SUMS.txt
          echo '${{ github.sha }}' > apk-delivery/SOURCE-COMMIT.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging apk-delivery/*.apk > apk-delivery/APK-METADATA.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Foundry-Mobile-Pixel8a-unsigned-release
          path: apk-delivery/*
          if-no-files-found: error
          retention-days: 30
